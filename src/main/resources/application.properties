spring.application.name=HealthSync-APIGateWay
server.port=8181

#register this service as Eureka client with Eureka server
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#spring.cloud.discovery.enabled= true


# routes info for restaurant service
spring.cloud.gateway.routes[0].id=HealthSync-UserService
spring.cloud.gateway.routes[0].uri=lb://HealthSync-UserService
spring.cloud.gateway.routes[0].predicates[0]=Path=/doctor/**
